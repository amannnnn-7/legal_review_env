[project]
name = "legal-review-env"
version = "0.1.0"
description = "OpenEnv legal contract redlining and risk abstraction environment using CUAD"
readme = "README.md"
authors = [
    { name = "Aman Paliwal", email = "t-apaliwal@microsoft.com" }
]
requires-python = ">=3.11"
dependencies = [
    "openenv-core[core]>=0.2.3",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "huggingface_hub>=1.0.0",
    "rapidfuzz>=3.14.0",
    "openai>=2.0.0",
    "httpx>=0.28.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4.0",
]

[project.scripts]
server = "server.app:main"
legal-review-env = "legal_review_env.server.app:main"
legal-review-env-baseline = "legal_review_env.baseline:main"
legal-review-env-prefetch = "legal_review_env.cuad:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/legal_review_env", "server"]

[tool.hatch.build.targets.sdist]
include = [
    "src/legal_review_env",
    "server",
    "README.md",
    "openenv.yaml",
    "Dockerfile",
    "docs",
    "tests",
]
